<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Job Offer</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background: #10b981; color: white; padding: 20px; text-align: center; }
        .content { padding: 20px; background: #f9fafb; }
        .button { display: inline-block; background: #10b981; color: white; padding: 12px 24px; text-decoration: none; border-radius: 5px; margin: 10px 0; }
        .footer { text-align: center; padding: 20px; font-size: 12px; color: #6b7280; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Job Offer</h1>
        </div>
        <div class="content">
            <p>Hello <strong>{{ candidate.user.first_name }}</strong>,</p>
            <p>Congratulations! We are pleased to offer you the <strong>{{ candidate.job.title }}</strong> position.</p>
            
            <p>Please check your dashboard for further steps.</p>
            
            <p>Welcome to the team!<br>ServiaAI Team</p>
        </div>
        <div class="footer">
            <p>ServiaAI – AI-Powered Hospitality Recruitment</p>
        </div>
    </div>
</body>
</html>
