openapi: 3.0.3
info:
  title: ServiaAI API
  description: API for candidate recruitment and AI screening platform
  version: 1.0.0

servers:
  - url: http://localhost:8000

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    Candidate:
      type: object
      properties:
        id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        phone:
          type: string
        role:
          type: string
        department:
          type: string
        country:
          type: string
        status:
          type: string
        ai_score:
          type: number
        cv_file_url:
          type: string

    CandidateCreateRequest:
      type: object
      required:
        - first_name
        - last_name
        - email
        - phone
        - role
        - country
        - cv_file
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        phone:
          type: string
        role:
          type: string
        country:
          type: string
        cv_file:
          type: string
          format: binary

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string

paths:

  /api/candidates/:

    post:
      summary: Create candidate application
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CandidateCreateRequest'

      responses:
        "201":
          description: Candidate created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Candidate'

        "400":
          description: Validation error

        "500":
          description: Server error


    get:
      summary: List candidates
      security:
        - BearerAuth: []

      parameters:
        - in: query
          name: role
          schema:
            type: string

        - in: query
          name: min_score
          schema:
            type: number

        - in: query
          name: status
          schema:
            type: string

        - in: query
          name: department
          schema:
            type: string

      responses:
        "200":
          description: List of candidates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Candidate'

        "401":
          description: Unauthorized

        "500":
          description: Server error


  /api/auth/login/:

    post:
      summary: Recruiter login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'

      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

        "401":
          description: Invalid credentials

        "500":
          description: Server error